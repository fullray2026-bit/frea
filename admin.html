<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>後台管理｜fréa</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css?v=quote-calculator">
</head>
<body class="admin-page">
  <main>
    <section class="admin-login" id="adminLogin">
      <div class="admin-login-card">
        <a class="admin-wordmark serif" href="index.html">fréa</a>
        <p class="admin-eyebrow">ADMINISTRATION</p>
        <h1>後台管理登入</h1>
        <p class="admin-muted">僅限經授權的管理員使用。</p>
        <form id="adminLoginForm">
          <label>Email
            <input type="email" name="email" autocomplete="username" required>
          </label>
          <label>密碼
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <button class="admin-primary" type="submit">登入後台</button>
          <p class="admin-message" id="adminLoginMessage" role="status"></p>
        </form>
        <a class="admin-back" href="index.html">← 返回網站首頁</a>
      </div>
    </section>

    <section class="admin-shell" id="adminShell" hidden>
      <aside class="admin-sidebar">
        <a class="admin-wordmark serif" href="index.html">fréa</a>
        <p class="admin-eyebrow">ADMIN CENTER</p>
        <nav>
          <button class="admin-nav is-active" type="button" data-admin-view="overview">總覽</button>
          <button class="admin-nav" type="button" data-admin-view="members">會員管理</button>
          <button class="admin-nav" type="button" data-admin-view="orders">訂單管理</button>
          <button class="admin-nav" type="button" data-admin-view="personal">代購訂單管理</button>
          <button class="admin-nav" type="button" data-admin-view="products">商品管理</button>
        </nav>
        <div class="admin-sidebar-foot">
          <span id="adminIdentity"></span>
          <button type="button" id="adminLogout">登出</button>
        </div>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <div>
            <p class="admin-eyebrow">FRÉA MANAGEMENT</p>
            <h1 id="adminPageTitle">管理總覽</h1>
          </div>
          <button class="admin-refresh" type="button" id="adminRefresh">重新整理</button>
        </header>
        <p class="admin-message" id="adminGlobalMessage" role="status"></p>

        <section class="admin-view" data-admin-panel="overview">
          <div class="admin-stats">
            <article><span>會員總數</span><strong id="statMembers">—</strong></article>
            <article><span>全部訂單</span><strong id="statOrders">—</strong></article>
            <article><span>待處理訂單</span><strong id="statPending">—</strong></article>
            <article><span>已完成訂單</span><strong id="statCompleted">—</strong></article>
          </div>
          <div class="admin-card">
            <h2>近期訂單</h2>
            <div id="recentOrders"></div>
          </div>
        </section>

        <section class="admin-view" data-admin-panel="members" hidden>
          <div class="admin-toolbar">
            <input id="memberSearch" type="search" placeholder="搜尋姓名、Email 或手機">
            <span id="memberCount"></span>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>會員</th><th>聯絡方式</th><th>收件資料</th><th>EZ WAY</th><th>加入日期</th></tr></thead>
              <tbody id="memberRows"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-view" data-admin-panel="orders" hidden>
          <div class="admin-toolbar">
            <input id="orderSearch" type="search" placeholder="搜尋訂單編號、姓名或手機">
            <select id="orderStatusFilter">
              <option value="">全部狀態</option>
              <option value="pending_payment">待匯款</option>
              <option value="payment_review">待核款</option>
              <option value="paid">已收款</option>
              <option value="processing">備貨中</option>
              <option value="shipped">已出貨</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <span id="orderCount"></span>
          </div>
          <div id="orderCards" class="admin-orders"></div>
        </section>

        <section class="admin-view" data-admin-panel="personal" hidden>
          <div class="admin-toolbar">
            <input id="personalSearch" type="search" placeholder="搜尋代購編號、姓名、Email 或手機">
            <select id="personalStatusFilter">
              <option value="">全部狀態</option>
              <option value="new">新需求</option>
              <option value="reviewing">確認中</option>
              <option value="quoted">已報價</option>
              <option value="confirmed">顧客已確認</option>
              <option value="purchased">日本已下單</option>
              <option value="shipped">已寄出</option>
              <option value="completed">已完成</option>
              <option value="cancelled">已取消</option>
            </select>
            <span id="personalCount"></span>
          </div>
          <div id="personalCards" class="admin-orders"></div>
        </section>

        <section class="admin-view" data-admin-panel="products" hidden>
          <div class="admin-toolbar product-toolbar">
            <input id="productSearch" type="search" placeholder="搜尋商品名稱、規格或用途／風味">
            <select id="productBrandFilter">
              <option value="">全部品牌</option>
              <option value="kayanoya">茅乃舍</option>
              <option value="kinto">KINTO</option>
              <option value="kajidonya">家事問屋</option>
              <option value="akomeya">AKOMEYA TOKYO</option>
              <option value="fukuoka-coffee">福岡咖啡精選</option>
            </select>
            <select id="productStatusFilter">
              <option value="">全部狀態</option>
              <option value="active">上架中</option>
              <option value="inactive">已下架</option>
            </select>
            <button class="admin-primary" id="productCreate" type="button">＋ 新增商品</button>
            <span id="productCount"></span>
          </div>

          <form class="admin-card product-form" id="productForm" hidden>
            <div class="product-form-head">
              <div><p class="admin-eyebrow">PRODUCT EDITOR</p><h2 id="productFormTitle">新增商品</h2></div>
              <button class="product-cancel" id="productCancel" type="button">取消</button>
            </div>
            <input id="productId" type="hidden">
            <input id="productExistingImage" type="hidden">
            <input id="productStoragePath" type="hidden">
            <div class="product-form-grid">
              <label>品牌 *<select id="productBrand" required>
                <option value="">請選擇品牌</option>
                <option value="kayanoya">茅乃舍</option><option value="kinto">KINTO</option>
                <option value="kajidonya">家事問屋</option><option value="akomeya">AKOMEYA TOKYO</option>
                <option value="fukuoka-coffee">福岡咖啡精選</option>
              </select></label>
              <label>商品名稱 *<input id="productName" required></label>
              <label>規格 *<input id="productSpecification" required></label>
              <label>用途／風味 *<input id="productUsage" required></label>
              <label>價格 *<input id="productPrice" type="number" min="0" step="1" required></label>
              <label>幣別 *<select id="productCurrency"><option value="JPY">JPY 日圓</option><option value="TWD">TWD 新台幣</option></select></label>
              <label>庫存數量 *<input id="productStock" type="number" min="0" step="1" value="0" required></label>
              <label>品牌內排序<input id="productSort" type="number" step="1" value="0"></label>
              <label class="product-wide">簡短介紹<textarea id="productDescription" rows="3" placeholder="顯示在商品名稱下方的簡短說明"></textarea></label>
              <label class="product-wide">商品照片（JPG、PNG、WebP，3MB 以內）<input id="productImage" type="file" accept="image/jpeg,image/png,image/webp"></label>
              <label>上架狀態<select id="productActive"><option value="true">上架</option><option value="false">下架</option></select></label>
              <div class="product-preview"><img id="productImagePreview" alt="商品圖片預覽" hidden><span id="productPreviewEmpty">尚未選擇圖片</span></div>
            </div>
            <div class="product-form-actions"><button class="admin-primary" id="productSave" type="submit">儲存商品</button><p class="admin-message" id="productFormMessage" role="status"></p></div>
          </form>

          <div id="productRows" class="product-list"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js?v=product-management-1"></script>
</body>
</html>
