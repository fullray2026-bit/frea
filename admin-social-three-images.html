<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>三圖組測試｜fréa</title><link rel="stylesheet" href="admin-social.css?v=20261012-editor2"><style>.triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.triptych img{width:100%;aspect-ratio:1;object-fit:contain;background:#faf7f1}.triptych h3{font-size:16px}textarea{width:100%}@media(max-width:760px){.triptych{grid-template-columns:1fr}}.test-note{background:#f4eee1;padding:16px;border-radius:12px}</style></head><body>
<header><a href="admin.html">← 返回管理後台</a><span>fréa</span></header><main><h1>商品三圖組測試</h1><p class="test-note">一次製作三張獨立的 1:1 商品圖：生活情境、商品資訊、細節／使用感。只儲存測試草稿，不傳 LINE、不發布 FB／IG。每組製作兩張情境／特寫生成圖，以及一張原圖資訊排版。請保持此頁開啟直到完成；中斷後可從清單繼續。</p><p id="status" role="status">正在確認登入…</p><section id="app" hidden>
<form id="testForm" class="card"><label>測試商品<select id="product" required></select></label><label>本篇風格<select id="style" required></select></label><label>商品類型<select id="type"><option value="object">器物</option><option value="food">食品</option><option value="package">包裝商品</option></select></label><button id="start" class="primary">製作三張測試圖</button></form>
<section class="card"><h2>已保存的測試草稿</h2><div class="toolbar"><select id="drafts" aria-label="測試草稿"></select><button id="open" type="button">查看測試草稿</button><button id="resume" type="button" hidden>繼續／重試未完成圖片</button></div></section>
<section id="result" hidden><h2 id="title"></h2><p id="progress" role="status"></p><div id="images" class="triptych"></div><div class="card"><h3>Facebook 文案</h3><p id="facebook" style="white-space:pre-wrap"></p><h3>Instagram 文案</h3><p id="instagram" style="white-space:pre-wrap"></p><details><summary>本篇保存的三圖組規則</summary><p id="rules" style="white-space:pre-wrap"></p></details></div></section>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="social-three-images-ui.js?v=20261013-three1"></script></body></html>
